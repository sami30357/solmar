<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0f16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 18, 0.55); z-index: 10; }
  #overlay.hidden { display: none; }
  #card { width: 620px; max-width: 92vw; background: #141824; border: 2px solid #ff4fd8; border-radius: 16px; padding: 28px 32px; color: #eef1f5; font-family: system-ui, sans-serif; text-align: center; box-shadow: 0 0 60px rgba(255, 79, 216, 0.25); }
  .logo { margin: 0; font-size: 64px; letter-spacing: 10px; color: #ffe14d; text-shadow: 0 0 24px rgba(255, 225, 77, 0.6), 3px 3px 0 #ff4fd8; }
  .tag { color: #39e6ff; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin: 4px 0 18px; }
  .story { font-size: 16px; line-height: 1.55; color: #c8cede; }
  .controls { font-size: 14px; color: #9fb4d8; line-height: 1.7; margin: 16px 0; }
  .controls b { color: #ffffff; }
  .title2 { margin: 0 0 10px; font-size: 40px; color: #ffe14d; letter-spacing: 3px; }
  .title2.busted { color: #ff4d4d; }
  .kicker { color: #39e6ff; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; margin: 0 0 6px; }
  .objective, .reward { font-size: 15px; color: #c8cede; }
  .objective b, .reward b { color: #ffe14d; }
  .fine { font-size: 12px; color: #6a7288; margin-top: 18px; }
  .btn { display: inline-block; margin: 8px 6px 0; padding: 12px 26px; font-size: 17px; font-weight: 700; color: #141824; background: #ffe14d; border: none; border-radius: 10px; cursor: pointer; }
  .btn:hover { background: #ffec8a; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar: drive, steal cars, run missions and dodge the police in an open city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="overlay" class="hidden"><div id="card"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
